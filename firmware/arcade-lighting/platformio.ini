[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
lib_deps = fastled/FastLED@3.9.15
monitor_speed = 115200

[env:esp32-network]
extends = env:esp32dev
build_flags = -DARCADE_NETWORK
lib_deps =
    ${env:esp32dev.lib_deps}
    bblanchon/ArduinoJson@7.4.2
